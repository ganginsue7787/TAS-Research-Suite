[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tas-research-suite"
version = "3.0.0"
description = "Topological Anomaly Score (TAS): A Persistent-Homology-Based Early Warning Framework for Critical Transitions in Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kang, In-Su", email = "your-email@example.com"}
]
keywords = [
    "topological-data-analysis",
    "persistent-homology",
    "deep-learning",
    "anomaly-detection",
    "neural-networks",
    "gradient-collapse",
    "early-warning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "gudhi>=3.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
gpu = [
    "ripser-plusplus>=0.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.0.0",
    "notebook>=7.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/ganginsue7787/TAS-Research-Suite"
Documentation = "https://github.com/ganginsue7787/TAS-Research-Suite/tree/main/docs"
Repository = "https://github.com/ganginsue7787/TAS-Research-Suite.git"
"Bug Tracker" = "https://github.com/ganginsue7787/TAS-Research-Suite/issues"

[project.scripts]
tas = "source.main:main"

[tool.setuptools]
packages = ["source"]

[tool.setuptools.package-data]
source = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | results
  | figures
  | tables
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["source"]
known_third_party = ["torch", "numpy", "scipy", "pandas", "gudhi", "matplotlib"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=source --cov-report=html --cov-report=term-missing -v"
minversion = "7.0"

[tool.coverage.run]
source = ["source"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "source/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
