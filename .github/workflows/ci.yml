name: TAS Suite CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gudhi numpy scipy pandas matplotlib
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install pytest pytest-cov
    - name: TAS Core self-test
      run: cd source && python tas_core.py
    - name: Run unit tests
      run: pytest source/tests/ -v --tb=short --cov=source --cov-report=xml:coverage.xml
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-py${{ matrix.python-version }}
        path: coverage.xml

  smoke:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install
      run: |
        pip install gudhi numpy scipy pandas matplotlib
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    - name: CLI test mode
      run: cd source && python main.py --mode test
    - name: Simple demo
      run: python examples/simple_tas_demo.py

  lint:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install flake8
    - name: Flake8 (errors only)
      run: |
        flake8 source/ examples/ notebooks/ \
          --count --select=E9,F63,F7,F82 --show-source --statistics
